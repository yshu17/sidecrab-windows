<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <title>Sidecrab</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <!-- Drag layer fills the window; the crab renders into the canvas on top of it. -->
    <div id="stage" data-tauri-drag-region>
      <canvas id="crab" width="32" height="32"></canvas>
      <!-- Static + always visible: status.js only swaps text, so it never resizes. -->
      <div id="status">
        <div class="row"><span class="dot" data-status="idle"></span><span class="what">CLAUDE</span></div>
        <div class="row" data-kind="ctx"><span class="k">CTX</span><span class="bar"><span class="fill"></span></span><span class="tok">--</span><span class="v">--%</span></div>
        <div class="row" data-kind="lim"><span class="k">5H</span><span class="bar"><span class="fill"></span></span><span class="v">--%</span><span class="t"><span class="rl">RESET </span><span class="rt">--</span></span></div>
        <!-- Compact mode's collapsed look: same panel, only the essentials. -->
        <div class="mini-wrap"><div class="mini"><span class="dot" data-status="idle"></span><span class="m">CLAUDE</span><span class="act"><i></i><i></i><i></i></span></div></div>
      </div>
    </div>
  </body>
</html>
