<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <title>Sidecrab</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <!-- Drag layer fills the window; the crab renders into the canvas on top of it. -->
    <div id="stage" data-tauri-drag-region>
      <canvas id="crab" width="32" height="32"></canvas>
      <!-- Static + always visible: status.js only swaps text, so it never resizes. -->
      <div id="status">
        <span class="dot" data-status="idle"></span><span class="what">Claude</span><span class="tok">--</span><span class="ctx">--%</span><span class="lim">5h --</span>
      </div>
    </div>
  </body>
</html>
