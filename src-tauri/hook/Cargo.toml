[package]
name = "sidecrab-hook"
version = "0.1.21"
edition = "2021"

# Standalone on purpose: no tauri deps, so it builds in seconds and breaks the
# externalBin chicken-and-egg (the app's build script validates the sidecar
# exists — which this crate produces).

[dependencies]
serde_json = "1"
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
